org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle process: avoids the "Could not connect to Kotlin compile daemon" warning
# (usually caused by a firewall/VPN/proxy or low memory). Slightly slower, but far more robust.
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Tandem configuration ------------------------------------------------
# URL of your deployed Cloudflare Worker (no trailing slash needed).
TANDEM_API_URL=https://tandem-api.thehdv7.workers.dev
# GitHub repo used for in-app updates (Releases), format owner/repo.
TANDEM_GITHUB_REPO=Hytyei/Tandem

# Google sign-in: the public *web* OAuth client id (not a secret). The Android client (package + release SHA-1) lives in the same Google Cloud project.
GOOGLE_WEB_CLIENT_ID=146527205813-nuuo1id1nqr14sa19j7fd3kol7og1lan.apps.googleusercontent.com
